use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - bing

general:
  debug: false
  instance_name: "Sprawdzeni Fachowcy Search"

search:
  safe_search: 1
  default_lang: "pl-PL"
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false

engines:
  - name: brave
    disabled: false

  - name: duckduckgo
    disabled: false

  - name: bing
    disabled: false
    language: "pl-PL"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0