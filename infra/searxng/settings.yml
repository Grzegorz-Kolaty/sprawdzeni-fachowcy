use_default_settings:
  engines:
    keep_only:
      - bing
      - google cse

general:
  debug: false
  instance_name: "Sprawdzeni Fachowcy Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false

engines:
  - name: bing
    disabled: false

  - name: google cse
    disabled: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0